<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="ডিজিটাল স্মার্ট ব্ল্যাকবোর্ড ও PDF টিচিং স্টুডিও — কালো/সাদা বোর্ড, PDF মার্কিং, OCR, প্রেজেন্টেশন, অফলাইন।">
<title>Smart Blackboard — Live Coaching Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/tailwind.generated.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- আইকন স্প্রাইট -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-thumbs" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 8l5 2.5-5 2.5z"/><path d="M8 21h8"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l6 17 2.6-7.4L21 10z"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-hl" viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M7 21l-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/></symbol>
  <symbol id="i-shapes" viewBox="0 0 24 24"><path d="M7 3l4 7H3z"/><rect x="13" y="13" width="8" height="8" rx="1.4"/><circle cx="7" cy="17" r="4"/><path d="M14 5h7"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
 <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3M12 14v3"/></symbol>
 <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0M12 14v3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></symbol>
  <symbol id="i-ocr" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M8 9h8M12 9v7"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l4 4v13a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M8 3v5h7V3M7 21v-7h10v7"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></symbol>
  <symbol id="i-ell" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></symbol>
  <symbol id="i-tri" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/></symbol>
  <symbol id="i-rtri" viewBox="0 0 24 24"><path d="M5 4v16h14z"/></symbol>
  <symbol id="i-laser" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 013 0V11M11 10.5V4a1.5 1.5 0 013 0v7M14 11V6a1.5 1.5 0 013 0v8c0 4-2 7-6 7-3 0-4-1.5-6-4l-2-3a1.5 1.5 0 012.4-1.8L8 15"/></symbol>
</svg>

<div id="app">
  <header id="topbar">
    <div class="brand-mark flex items-center justify-center rounded-xl" aria-hidden="true"><svg class="ic"><use href="#i-board"/></svg></div>
    <button class="ib" id="btnMenu" aria-label="ক্লাস ও নোট মেনু"><svg class="ic"><use href="#i-menu"/></svg></button>
    <button class="title" id="projTitle" aria-label="নোটের তালিকা">ক্লাস নোট</button>
    <span id="roomLiveBadge" class="room-live-badge" hidden></span>
    <div class="save" id="saveDot" data-s="ok"><i></i><span id="saveTxt">সংরক্ষিত</span></div>
    <div class="pager">
      <button class="ib sm" id="btnPrev" aria-label="আগের পাতা"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="pno" id="pageNo" aria-label="পাতা তালিকা">1 / 1</button>
      <button class="ib sm" id="btnNext" aria-label="পরের পাতা"><svg class="ic"><use href="#i-next"/></svg></button>
    </div>
    <button class="ib" id="btnThumbs" aria-label="থাম্বনেইল"><svg class="ic"><use href="#i-thumbs"/></svg></button>
    <button class="ib theme-toggle" id="themeToggle" type="button" aria-label="ডার্ক থিম চালু করুন" title="থিম বদলান"><svg class="ic theme-sun"><use href="#i-sun"/></svg><svg class="ic theme-moon"><use href="#i-moon"/></svg></button>
    <button class="ib" id="btnPresent" aria-label="প্রেজেন্টেশন"><svg class="ic"><use href="#i-play"/></svg></button>
  </header>

  <main id="stageWrap" data-tool="pen">
    <div id="stage">
      <canvas id="cvBg"></canvas><canvas id="cvInk"></canvas><canvas id="cvOv"></canvas>
    </div>
    <div id="selBar" class="floating" hidden>
      <button class="ib" id="selEdit" aria-label="সম্পাদনা"><svg class="ic"><use href="#i-edit"/></svg></button>
      <button class="ib" id="selLock" aria-label="লক করুন" title="লক করুন"><svg class="ic"><use href="#i-lock"/></svg></button>
      <button class="ib" id="selDup" aria-label="কপি"><svg class="ic"><use href="#i-copy"/></svg></button>
      <button class="ib" id="selDel" aria-label="মুছুন"><svg class="ic"><use href="#i-trash"/></svg></button>
      <button class="ib" id="selDone" aria-label="বন্ধ"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <button id="btnFit" class="floating fitbtn" hidden><svg class="ic"><use href="#i-fit"/></svg>ফিট</button>
  </main>

  <footer id="dock">
    <div id="opts">
      <div class="orow" id="rowShape">
        <button class="chip sq" data-shape="line" aria-label="সরলরেখা"><svg class="ic"><use href="#i-line"/></svg></button>
        <button class="chip sq" data-shape="arrow" aria-label="তীর"><svg class="ic"><use href="#i-arrow"/></svg></button>
        <button class="chip sq" data-shape="rect" aria-label="আয়তক্ষেত্র"><svg class="ic"><use href="#i-rect"/></svg></button>
        <button class="chip sq" data-shape="ell" aria-label="বৃত্ত/উপবৃত্ত"><svg class="ic"><use href="#i-ell"/></svg></button>
        <button class="chip sq" data-shape="tri" aria-label="ত্রিভুজ"><svg class="ic"><use href="#i-tri"/></svg></button>
        <button class="chip sq" data-shape="rtri" aria-label="সমকোণী ত্রিভুজ"><svg class="ic"><use href="#i-rtri"/></svg></button>
        <span class="sp"></span>
        <button class="chip" id="optDash">ড্যাশ</button>
        <button class="chip" id="optFill">ভরাট</button>
      </div>
      <div class="orow" id="rowEr">
        <button class="chip" data-er="pixel">সাধারণ ইরেজার</button>
        <button class="chip" data-er="object">পুরো আঁকা মোছা</button>
      </div>
      <div class="orow hint" id="rowHint"></div>
      <div class="orow" id="rowColor">
        <div id="swatches"></div>
        <label class="sw custom" aria-label="নিজের রঙ"><input type="color" id="customColor" value="#ffffff"></label>
      </div>
      <div class="orow" id="rowSize">
        <span id="sizeLbl">মোটা</span>
        <input type="range" id="size" min="1" max="30" value="4">
        <b id="sizeVal">4</b>
      </div>
    </div>
    <div id="tools" class="tools">
      <button class="tb" data-tool="select"><svg class="ic"><use href="#i-select"/></svg><span>নির্বাচন</span></button>
      <button class="tb on" data-tool="pen"><svg class="ic"><use href="#i-pen"/></svg><span>কলম</span></button>
      <button class="tb" data-tool="hl"><svg class="ic"><use href="#i-hl"/></svg><span>হাইলাইট</span></button>
      <button class="tb" data-tool="er"><svg class="ic"><use href="#i-eraser"/></svg><span>ইরেজার</span></button>
      <button class="tb" data-tool="shape"><svg class="ic"><use href="#i-shapes"/></svg><span>আকৃতি</span></button>
      <button class="tb" data-tool="text"><svg class="ic"><use href="#i-text"/></svg><span>লেখা</span></button>
      <button class="tb" id="tUndo"><svg class="ic"><use href="#i-undo"/></svg><span>আনডু</span></button>
      <button class="tb" id="tRedo"><svg class="ic"><use href="#i-redo"/></svg><span>রিডু</span></button>
    </div>
  </footer>
</div>

<div id="backdrop" hidden></div>

<aside id="menu" class="sheet left" hidden>
  <div class="shead"><b>স্মার্ট ব্ল্যাকবোর্ড</b><button class="ib" id="menuClose" aria-label="বন্ধ"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div id="menuList"></div>
</aside>

<aside id="thumbPanel" class="sheet right" hidden>
  <div class="shead"><b>পাতাসমূহ</b><button class="ib" id="thumbClose" aria-label="বন্ধ"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="thbar">
    <button class="chip" id="thAdd"><svg class="ic"><use href="#i-plus"/></svg>নতুন</button>
    <button class="chip" id="thDup"><svg class="ic"><use href="#i-copy"/></svg>কপি</button>
    <button class="chip" id="thLeft"><svg class="ic"><use href="#i-prev"/></svg>আগে</button>
    <button class="chip" id="thRight">পরে<svg class="ic"><use href="#i-next"/></svg></button>
    <button class="chip danger" id="thDel"><svg class="ic"><use href="#i-trash"/></svg>মুছুন</button>
  </div>
  <div id="thumbGrid"></div>
</aside>

<div id="presentBar" class="floating">
  <button class="ib" id="pbPrev" aria-label="আগের"><svg class="ic"><use href="#i-prev"/></svg></button>
  <span id="pbNo">1 / 1</span>
  <button class="ib" id="pbNext" aria-label="পরের"><svg class="ic"><use href="#i-next"/></svg></button>
  <i class="vsep"></i>
  <button class="ib" data-pm="nav" aria-label="পাতা বদল"><svg class="ic"><use href="#i-hand"/></svg></button>
  <button class="ib" data-pm="laser" aria-label="লেজার"><svg class="ic"><use href="#i-laser"/></svg></button>
  <button class="ib" data-pm="draw" aria-label="কলম"><svg class="ic"><use href="#i-pen"/></svg></button>
  <span id="pDraw" hidden>
    <i class="vsep"></i>
    <button class="ib" data-pt="pen" aria-label="কলম"><svg class="ic"><use href="#i-pen"/></svg></button>
    <button class="ib" data-pt="hl" aria-label="হাইলাইটার"><svg class="ic"><use href="#i-hl"/></svg></button>
    <button class="ib" data-pt="er" aria-label="ইরেজার"><svg class="ic"><use href="#i-eraser"/></svg></button>
    <button class="dotc" data-pc="#ffffff" style="background:#fff" aria-label="সাদা"></button>
    <button class="dotc" data-pc="#39ff14" style="background:#39ff14" aria-label="সবুজ"></button>
    <button class="dotc" data-pc="#facc15" style="background:#facc15" aria-label="হলুদ"></button>
    <button class="dotc" data-pc="#f87171" style="background:#f87171" aria-label="লাল"></button>
    <button class="ib" id="pUndo" aria-label="আনডু"><svg class="ic"><use href="#i-undo"/></svg></button>
  </span>
  <i class="vsep"></i>
  <button class="ib" id="pExit" aria-label="প্রেজেন্টেশন বন্ধ"><svg class="ic"><use href="#i-x"/></svg></button>
</div>

<div id="modal" class="modal" hidden>
  <div class="card"><h3 id="mTitle"></h3><div id="mBody"></div><div id="mBtns"></div></div>
</div>

<div id="busy" hidden>
  <div class="bcard"><div class="spin"></div><p id="busyMsg"></p><div class="bar"><i id="busyBar"></i></div><button class="btn" id="busyCancel" hidden>বাতিল</button></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="splash" aria-live="polite">
  <div class="sp-wrap">
    <svg class="sp-logo" viewBox="0 0 120 120" aria-hidden="true">
      <rect class="sp-board" x="14" y="22" width="92" height="62" rx="8"/>
      <path class="sp-write" d="M30 60 C 42 40, 52 78, 64 58 S 84 42, 92 60"/>
      <path class="sp-stand" d="M60 84v14M42 100h36"/>
    </svg>
    <div class="g">স্মার্ট ব্ল্যাকবোর্ড</div>
    <small>PDF টিচিং স্টুডিও</small>
    <div class="sp-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<input type="file" id="filePdf" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>

<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/rooms.js"></script>
<script src="js/features.js"></script>
</body>
</html>
